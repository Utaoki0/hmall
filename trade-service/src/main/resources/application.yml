server:
  port: 8084
spring:
  application:
    name: trade-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.10.101:8848
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/hm-trade?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
  rabbitmq:
    host: 192.168.10.101 # 你的虚拟机IP
    port: 5672 # 端口
    virtual-host: /hmall # 虚拟主机
    username: hmall # 用户名
    password: 123 # 密码
    listener:
      simple:
        prefetch: 1
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
#feign: # 开启连接池
#  client:
#    refresh-enabled: true


knife4j:
  enable: true
  openapi:
    title: 黑马商城接口文档
    description: "黑马商城接口文档"
    url: https://github.com/Utaoki0/hmall/tree/b1
    version: v2.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.heima.trade.controller

logging:
  level:
    com.heima.trade: debug
  pattern:
    dateformat: HH-mm-ss-SSS
  file:
    path: "logs/${spring.application.name}"
spring:
  application:
    name: item-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.10.101:8848

  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/hm-item?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

server:
  port: 8081

knife4j:
  enable: true
  openapi:
    title: 黑马商城接口文档
    description: "黑马商城接口文档"
    url: https://github.com/Utaoki0/hmall/tree/b1
    version: v2.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.heima.item.controller

logging:
  level:
    com.hmall.item: debug
  pattern:
    dateformat: HH-mm-ss-SSS
  file:
    path: "logs/${spring.application.name}"